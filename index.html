<script>
    let fileData = [];
    let rawComparisonResult = [];
    let currentUser = 'admin'; // Langsung set sebagai admin

    const DEFAULT_USERS = {
        'admin': { pass: '123', role: 'admin', active: true, usageCount: 0 }
    };

    function getUsersDB() {
        const stored = localStorage.getItem('app_users_db');
        if (!stored) {
            localStorage.setItem('app_users_db', JSON.stringify(DEFAULT_USERS));
            return DEFAULT_USERS;
        }
        return JSON.parse(stored);
    }

    function saveUsersDB(db) {
        localStorage.setItem('app_users_db', JSON.stringify(db));
    }

    // Begitu web dibuka, langsung tampilkan dashboard tanpa overlay login
    window.addEventListener('DOMContentLoaded', () => {
        applyUserAccess('admin');
    });

    function applyUserAccess(username) {
        document.getElementById('usernameDisplay').innerText = username;
        document.getElementById('roleLabel').innerText = 'ADMIN';

        const db = getUsersDB();
        const user = db[username] || { usageCount: 0 };
        document.getElementById('usageCountDisplay').innerText = `${user.usageCount || 0}x`;

        const adminTabs = document.getElementById('adminTabs');
        const btnDownload = document.getElementById('btnDownload');
        const btnPrint = document.getElementById('btnPrint');

        // Tampilkan semua akses
        adminTabs.classList.remove('hidden');
        btnDownload.classList.remove('hidden');
        btnPrint.classList.remove('hidden');
    }

    function switchTab(tab) {
        if (tab === 'compare') {
            document.getElementById('tabCompareContent').classList.remove('hidden');
            document.getElementById('tabUsersContent').classList.add('hidden');
            document.getElementById('tabCompareBtn').className = "px-4 py-2 rounded-lg text-xs font-bold transition bg-indigo-600 text-white";
            document.getElementById('tabUsersBtn').className = "px-4 py-2 rounded-lg text-xs font-bold transition text-slate-400 hover:text-white";
        } else {
            document.getElementById('tabCompareContent').classList.add('hidden');
            document.getElementById('tabUsersContent').classList.remove('hidden');
            document.getElementById('tabUsersBtn').className = "px-4 py-2 rounded-lg text-xs font-bold transition bg-indigo-600 text-white";
            document.getElementById('tabCompareBtn').className = "px-4 py-2 rounded-lg text-xs font-bold transition text-slate-400 hover:text-white";
        }
    }

    // --- PROSES EXCEL & KOMPARASI ---
    document.getElementById('excelFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        document.getElementById('fileInfo').innerText = `File: ${file.name}`;
        
        const reader = new FileReader();
        reader.onload = function(evt) {
            const wb = XLSX.read(evt.target.result, {type: 'binary'});
            const ws = wb.Sheets[wb.SheetNames[0]];
            fileData = XLSX.utils.sheet_to_json(ws, {defval: ""});
            if (fileData.length > 0) {
                document.getElementById('compareBtn').removeAttribute('disabled');
            }
        };
        reader.readAsBinaryString(file);
    });

    function compareColumns() {
        const c1 = document.getElementById('col1').value.trim();
        const c2 = document.getElementById('col2').value.trim();

        let arr1 = [], arr2 = [];
        fileData.forEach(r => {
            if (r[c1] !== undefined && r[c1] !== '') arr1.push(String(r[c1]).trim());
            if (r[c2] !== undefined && r[c2] !== '') arr2.push(String(r[c2]).trim());
        });

        let set1 = new Set(arr1), set2 = new Set(arr2);
        let allVals = Array.from(new Set([...arr1, ...arr2]));

        rawComparisonResult = [];
        let countMatch = 0;
        let countCol1Diff = 0;
        let countCol2Diff = 0;

        allVals.forEach(val => {
            let in1 = set1.has(val), in2 = set2.has(val);
            let status = '';
            
            if (in1 && in2) {
                status = 'TRUE';
                countMatch++;
            } else if (in1) {
                status = `Hanya di ${c1}`;
                countCol1Diff++;
            } else {
                status = `Hanya di ${c2}`;
                countCol2Diff++;
            }

            rawComparisonResult.push({ val1: in1 ? val : '', val2: in2 ? val : '', status });
        });

        document.getElementById('statTotal').innerText = allVals.length;
        document.getElementById('statMatch').innerText = countMatch;
        document.getElementById('statCol1Label').innerText = `Hanya di ${c1}`;
        document.getElementById('statCol1Diff').innerText = countCol1Diff;
        document.getElementById('statCol2Label').innerText = `Hanya di ${c2}`;
        document.getElementById('statCol2Diff').innerText = countCol2Diff;

        // Update riwayat proses
        const db = getUsersDB();
        db['admin'].usageCount = (db['admin'].usageCount || 0) + 1;
        saveUsersDB(db);
        document.getElementById('usageCountDisplay').innerText = `${db['admin'].usageCount}x`;

        document.getElementById('resultSection').classList.remove('hidden');
        renderMultiColumnLayout();
    }

    function renderMultiColumnLayout() {
        const numCols = parseInt(document.getElementById('printColSelect').value) || 3;
        const c1 = document.getElementById('col1').value.trim();
        const c2 = document.getElementById('col2').value.trim();
        const container = document.getElementById('multiColumnContainer');
        const orientation = document.getElementById('printOrientationSelect').value;

        container.className = 'p-1';
        container.innerHTML = '';

        const totalRows = rawComparisonResult.length;
        if (totalRows === 0) return;

        const rowsPerTable = orientation === 'landscape' ? 34 : 48;
        const rowsPerPage = rowsPerTable * numCols;
        const totalPages = Math.ceil(totalRows / rowsPerPage);

        for (let page = 0; page < totalPages; page++) {
            const pageStart = page * rowsPerPage;
            const pageEnd = Math.min(pageStart + rowsPerPage, totalRows);

            const pageDiv = document.createElement('div');
            pageDiv.className = `print-page cols-${numCols} p-1`;

            for (let col = 0; col < numCols; col++) {
                const startIndex = pageStart + (col * rowsPerTable);
                const endIndex = Math.min(startIndex + rowsPerTable, pageEnd);

                if (startIndex >= pageEnd) break;

                let tableHtml = `
                    <div class="print-table-block border border-slate-700 rounded-xl overflow-hidden bg-slate-900 h-fit">
                        <table class="print-table w-full text-left text-xs border-collapse">
                            <thead class="bg-slate-800 text-slate-300 border-b border-slate-700 font-bold">
                                <tr>
                                    <th class="p-2 border-r border-slate-700 text-center w-8">NO</th>
                                    <th class="p-2 border-r border-slate-700 text-center">${c1}</th>
                                    <th class="p-2 border-r border-slate-700 text-center">${c2}</th>
                                    <th class="p-2 text-center">STATUS</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-800 text-slate-300">
                `;

                for (let i = startIndex; i < endIndex; i++) {
                    const item = rawComparisonResult[i];
                    const isTrue = item.status === 'TRUE';
                    const bgStyle = isTrue
                        ? 'bg-emerald-500/10 text-emerald-400 font-semibold'
                        : 'bg-amber-500/10 text-amber-400 font-semibold';

                    tableHtml += `
                        <tr>
                            <td class="p-1.5 border-r border-slate-800 font-mono text-center text-[10px] text-slate-400">${i + 1}</td>
                            <td class="p-1.5 border-r border-slate-800 font-mono text-center">${item.val1}</td>
                            <td class="p-1.5 border-r border-slate-800 font-mono text-center">${item.val2}</td>
                            <td class="p-1.5 text-center ${bgStyle}">${item.status}</td>
                        </tr>
                    `;
                }

                tableHtml += `
                            </tbody>
                        </table>
                    </div>
                `;

                pageDiv.insertAdjacentHTML('beforeend', tableHtml);
            }

            container.appendChild(pageDiv);
        }
    }

    function updatePrintPageStyle() {
        const orientation = document.getElementById('printOrientationSelect').value;
        const styleTag = document.getElementById('dynamicPrintStyle');
        let currentCss = styleTag.innerHTML;
        currentCss = currentCss.replace(/@page\s*{[^}]*}/, `@page { size: A4 ${orientation}; margin: 8mm; }`);
        styleTag.innerHTML = currentCss;
    }

    function triggerPrint() {
        updatePrintPageStyle();
        window.print();
    }

    function downloadResult() {
        const c1 = document.getElementById('col1').value.trim();
        const c2 = document.getElementById('col2').value.trim();
        const exportData = rawComparisonResult.map(i => ({ [c1]: i.val1, [c2]: i.val2, "STATUS": i.status }));
        const ws = XLSX.utils.json_to_sheet(exportData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Hasil Komparasi");
        XLSX.writeFile(wb, `Hasil_Komparasi_${c1}_vs_${c2}.xlsx`);
    }
</script>
