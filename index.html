<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Compere Data EJ & GL</title>
    <!-- Library Excel & Tailwind CSS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style id="dynamicPrintStyle">
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0f172a;
            color: #f8fafc;
        }

        .slate-card {
            background: #1e293b;
            border: 1px solid #334155;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .slate-nav {
            background: #0f172a;
            border-bottom: 1px solid #334155;
        }

        .slate-input {
            background: #0f172a;
            border: 1px solid #334155;
            color: #f8fafc;
            transition: border-color 0.15s ease;
        }

        .slate-input:focus {
            border-color: #6366f1;
            outline: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
            transition: opacity 0.15s ease;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        /* GRID LAYOUT DINAMIS UNTUK PREVIEW & PRINT (TANPA MAX-HEIGHT) */
        .preview-grid {
            display: grid;
            gap: 12px;
            width: 100%;
            align-items: start;
        }

        .cols-1 { grid-template-columns: repeat(1, minmax(0, 1fr)); }
        .cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        .cols-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }

        @media (max-width: 1024px) {
            .preview-grid { grid-template-columns: repeat(1, minmax(0, 1fr)) !important; }
        }

        /* CETAK: SETIAP HALAMAN ADALAH 1 GRUP TABEL.
           Data mengalir VERTIKAL di tabel, lalu tabel berikutnya ke SAMPING.
           Setelah semua kolom pada satu halaman penuh, baru pindah ke halaman berikutnya. */
        @page {
            size: A4 portrait;
            margin: 8mm;
        }

        .print-page {
            display: grid;
            gap: 6px;
            width: 100%;
            box-sizing: border-box;
            align-items: start;
        }

        .print-page.cols-1 { grid-template-columns: repeat(1, minmax(0, 1fr)); }
        .print-page.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .print-page.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .print-page.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        .print-page.cols-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }

        .site-footer {
            text-align: center;
            padding: 10px 16px 14px;
            font-size: 10px;
            color: #64748b;
            font-weight: 500;
        }

        @media print {
            .site-footer { display: none !important; }
            body {
                background: white !important;
                color: black !important;
            }

            .no-print { display: none !important; }

            #resultSection {
                border: none !important;
                box-shadow: none !important;
                padding: 0 !important;
                background: transparent !important;
                width: 100% !important;
            }

            .stat-card-print {
                border: 1px solid #64748b !important;
                background: #f8fafc !important;
                color: black !important;
                padding: 4px 8px !important;
                border-radius: 6px !important;
            }

            #multiColumnContainer {
                display: block !important;
                width: 100% !important;
                overflow: visible !important;
                padding: 0 !important;
            }

            .print-page {
                display: grid !important;
                width: 100% !important;
                gap: 6px !important;
                break-after: page !important;
                page-break-after: always !important;
                break-inside: avoid !important;
                page-break-inside: avoid !important;
                align-items: start !important;
            }

            .print-page:last-child {
                break-after: auto !important;
                page-break-after: auto !important;
            }

            .print-page.cols-1 { grid-template-columns: repeat(1, minmax(0, 1fr)) !important; }
            .print-page.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
            .print-page.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; }
            .print-page.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)) !important; }
            .print-page.cols-5 { grid-template-columns: repeat(5, minmax(0, 1fr)) !important; }

            .print-table-block {
                break-inside: avoid !important;
                page-break-inside: avoid !important;
                border: 1px solid #64748b !important;
                background: white !important;
                border-radius: 4px !important;
                overflow: hidden !important;
                height: fit-content !important;
            }

            table.print-table {
                width: 100% !important;
                border-collapse: collapse !important;
                font-size: 7.5pt !important;
                background: white !important;
                color: black !important;
            }

            table.print-table th,
            table.print-table td {
                padding: 2px 3px !important;
                border: 1px solid #94a3b8 !important;
            }

            table.print-table th {
                background-color: #f1f5f9 !important;
                color: black !important;
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-slate-100">

    <!-- HEADER APLIKASI -->
    <header class="slate-nav sticky top-0 z-40 no-print">
        <div class="max-w-7xl mx-auto px-6 py-3.5 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center font-bold text-white shadow">🔎</div>
                <div>
                    <h1 class="text-sm font-bold tracking-wide leading-tight text-white">SISTEM COMPERE DATA</h1>
                    <p class="text-[10px] text-slate-400 font-medium">CARI SELISIH SAMPAI DAPAT DENGAN WEB INI</p>
                </div>
            </div>

            <div id="userInfo" class="flex items-center space-x-3">
                <div class="bg-slate-900 border border-slate-700 px-3 py-1.5 rounded-full text-xs flex items-center space-x-2">
                    <span class="text-slate-400 text-[11px]">Proses Data:</span>
                    <span id="usageCountDisplay" class="font-bold text-emerald-400 font-mono">0x</span>
                </div>
            </div>
        </div>
    </header>

    <!-- KONTEN UTAMA -->
    <main class="max-w-7xl mx-auto px-6 py-8 w-full flex-grow">
        
        <div class="mb-6 no-print slate-card p-6 rounded-2xl flex flex-col md:flex-row justify-between md:items-center gap-4">
            <div>
                <h2 class="text-xl font-bold text-white tracking-tight" id="dashboardTitle">Dashboard Komparasi</h2>
                <p class="text-slate-400 text-xs mt-1 font-medium">Unggah file Excel, pilih kolom, lalu lakukan pembandingan data.</p>
            </div>
        </div>

        <!-- MODUL KOMPARASI DATA -->
        <div id="tabCompareContent">
            <div class="slate-card p-6 rounded-2xl mb-6 no-print">
                <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">1. Pilih File Excel (.xlsx / .csv)</label>
                <input type="file" id="excelFile" accept=".xlsx, .xls, .csv" class="block w-full text-xs text-slate-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-600/20 file:text-indigo-300 hover:file:bg-indigo-600/30 cursor-pointer border border-slate-700 rounded-xl p-1 bg-slate-900"/>
                <p id="fileInfo" class="text-xs text-slate-400 mt-2 font-medium">Belum ada file dipilih</p>
            </div>

            <div class="slate-card p-6 rounded-2xl mb-6 no-print">
                <h3 class="text-xs font-bold text-slate
